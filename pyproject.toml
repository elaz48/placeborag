[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "placeborag"
dynamic = ["version"]
description = "Deterministic test doubles for the retrieval half of a RAG pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "elaz48" }]
keywords = ["rag", "retrieval", "testing", "embeddings", "vector-store", "mock", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/elaz48/placeborag"
Issues = "https://github.com/elaz48/placeborag/issues"

[project.entry-points.pytest11]
# Registers the fixtures when placeborag is installed. The library does not
# import pytest, so a non-pytest user never pays for this.
placeborag = "placeborag.pytest_plugin"

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.6"]

[tool.hatch.version]
# Single source of truth. Bumping __version__ is the whole release edit.
path = "src/placeborag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/placeborag"]

[tool.hatch.build.targets.sdist]
include = ["src/placeborag", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — flags syntax kept alive for versions we dropped
    "B",    # bugbear — mutable defaults, loop-variable capture
    "SIM",  # simplify
    "RUF",  # ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests reach for private state deliberately, and fixtures shadow their own
# names by design.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
# examples/ runs in CI too. An example that quietly rots is worse than none.
testpaths = ["tests", "examples"]
